site_name: My Projects
nav:
  - index.md
  - Overview: documentation_overview.md
  - Apps:
    - apps/task_app.md
    - apps/weather_app.md
  - Academic Projects:
    - academic/mypas.md
    - academic/parallel.md
    - academic/mms_simulator.md
    - academic/mysh.md
    - academic/wsn.md
  - Personal Projects:
    - Web:
      - personal/web/clock.md
      - personal/web/calculator.md
    - Python:
      - personal/python/python_projects.md
      - Nootebooks:
        - Highest movies grossing:
          - personal/python/movies_grossing/movies.ipynb
          - personal/python/movies_grossing/algorithms.ipynb
        - personal/python/netflix/netflix_data_analisys.ipynb
    - C/C++:
      - personal/c_cpp_projects/confectionery/confectionery.md
      - personal/c_cpp_projects/service_provider/service_provider.md
#
#
# Don't alter the following sections
#
#
repo_url: https://github.com/joaohb07/documentation
repo_name: documentation
edit_uri: ""
theme:
  name: material
  logo: img/logo.gif
  favicon: img/logo.gif
  icon:
    repo: fontawesome/brands/gitkraken
  features:
    - content.code.annotate
    - navigation.tabs
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: "(prefers-color-scheme: light)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      theme: dark
extra_css:
  - stylesheets/extra_css.css
  - stylesheets/clock.css
  - stylesheets/calculator.css
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js